name: Deploy React App to HostGator - develop branch

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install 

      - name: Build React app
        run: npm run build 
        env: 
            # YouTube API (existente)
            VITE_YOUTUBE_CHANNEL_ID: ${{ secrets.VITE_YOUTUBE_CHANNEL_ID }}
            VITE_YOUTUBE_BASE_URL: ${{ secrets.VITE_YOUTUBE_BASE_URL }}
            VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
            
            # DatoCMS API Tokens
            VITE_DATO_API_TOKEN: ${{ secrets.VITE_DATO_API_TOKEN }}
            VITE_DATO_MANAGEMENT_TOKEN: ${{ secrets.VITE_DATO_MANAGEMENT_TOKEN }}
            
            # Admin Credentials (Desenvolvimento)
            VITE_ADMIN_USER: ${{ secrets.VITE_ADMIN_USER_DEV }}
            VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD_DEV }}
            
            # Environment
            VITE_APP_ENV: development

      - name: Deploy to HostGator via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: novo.igrejacoerp.com.br/
          delete-remote: true 
          exclude: .htaccess 
